<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- cac the html -->
    <h1>buoi hoc so 2</h1>
    <h2>tieu de bai hoc</h2>
    <h3>the h3</h3>
    <h4>the h4</h4>
    <h5>the h5</h5>
    <h6>the h6</h6>
    <!-- the p: the paragraph, la the dung de dinh dang van ban -->
    <p>adidaphat amen adinomoto aquafina aquamen abcxyz</p>
    <!-- the in dam:strong ,b  -->
    <!-- the gach duoi: u -->
    <u>chyen trang</u>
    <br />
    <b>chu in dam</b>
    <strong>chu in dam</strong>
    <!-- the in nghieng: em, i-->
    <em>the in nghieng</em>
    <i>in nghieng</i>
    <!-- 1 vai the khac : div, hr, br,...
 1. div: dung de tạo khối, thường bao bọc các thẻ khác tạo thành 1 khối
 2. hr: xuống dòng va tạo 2 đường kẻ ngang
 3. br: dung để xuong dong dung cho nhưng the noi tuyen-->
    <div>
        khoi coden so 1
        <b>noi dung khoi code so 1<b>
    </div>
    <hr />


    <div>
        khoi coden so 2
        <b>noi dung khoi code so 2<b>
    </div>
    <hr />
    <!--có 2 loại thẻ 
 1. thẻ nội tuyến: là những thể không tự xuống dòng: nguyên nhânn là có thuộc tính display khác block( inline,, inline-block, inline-index, inline-grid,...
 2. thẻ khối: là n h:html tag-->
    <img src="https://i.makeagif.com/media/12-07-2022/j7Vj-R.gif" alt="mot con chó ngu" />
    <a></a>
</body>

</html>
